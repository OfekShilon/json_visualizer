<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ file_name }} - JSON Viewer</title>
    <link rel="stylesheet" href="static/css/json-visualizer.css">
</head>
<body>
    <h1>{{ file_name }}</h1>
    <div class="controls">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search JSON...">
            <button id="search-button">Search</button>
            <label class="checkbox-container search-option">
                <input type="checkbox" id="case-sensitive">
                <span class="checkbox-text">Case-sensitive search</span>
            </label>
        </div>
        <div class="view-options">
            <label class="checkbox-container">
                <input type="checkbox" id="hide-nulls">
                <span class="checkbox-text">Hide nulls</span>
            </label>
            <label class="checkbox-container">
                <input type="checkbox" id="line-wrap" checked>
                <span class="checkbox-text">Line wrap</span>
            </label>
        </div>
    </div>
    <div id="json-container" class="with-line-wrap"></div>
    
    <!-- Hidden element to pass JSON data to JavaScript -->
    <script type="application/json" id="json-data">{{ json_data|tojson|safe }}</script>
    
    <!-- External JavaScript file -->
    <script src="static/js/json-visualizer.js"></script>
</body>
</html>
